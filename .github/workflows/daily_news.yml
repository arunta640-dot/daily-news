name: Daily news
on:
  schedule:
    - cron: "0 3 * * *"   # 06:00 Bahrain time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - name: Build digest, notify phone, keep a copy for the weekly review
        run: python daily_news.py --save
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NEWS_APP_URL: ${{ secrets.NEWS_APP_URL }}
      - name: Save history
        run: |
          git config user.name "daily-news"
          git config user.email "daily-news@users.noreply.github.com"
          git add news_history
          git diff --cached --quiet || git commit -m "News history $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
